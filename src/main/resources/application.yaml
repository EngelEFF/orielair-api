spring:
  config:
    import: optional:classpath:env.properties

  application:
    name: Oriel Air

  datasource:
    url: ${ORIELAIR_DB_URL}
    username: ${ORIELAIR_DB_USERNAME}
    password: ${ORIELAIR_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: ${ORIELAIR_SPRING_JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${ORIELAIR_SPRING_SERVER_PORT:8082}
  servlet:
    context-path: /api

debug: ${ORIELAIR_SPRING_DEBUG:false}